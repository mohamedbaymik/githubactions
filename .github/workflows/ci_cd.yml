# ============================================================
# Nom du workflow (affiché dans l'onglet "Actions" de GitHub)
# ============================================================
name: CI/CD Pipeline
# ============================================================
# DÉCLENCHEURS (Events)
# Le workflow se lance quand :
# - un push arrive sur la branche main
# - une pull request cible main
# ============================================================
on:
  #push:
  #  branches: [ main ]
  #pull_request:
  #  branches: [ main ]
  workflow_dispatch:
  
# ============================================================
# JOBS (tâches)
# ============================================================
jobs:
  # ---------------------------------------------------------
  # JOB 1 : Tests
  # Ce job vérifie que le code fonctionne.
  # ---------------------------------------------------------
  test:
    # Runner : machine Ubuntu fournie par GitHub
    runs-on: ubuntu-latest
    # Étapes du job (exécutées séquentiellement)
    steps:
      # 1. Récupère le code du dépôt sur le runner
      #    (Cette action clone le dépôt dans le répertoire de
      #    travail du runner, ce qui rend les steps suivants 
      #    capables de lire et d’utiliser vos fichiers. 
 #    Sans cette action, le runner est vide)
      - name: Récupérer le code
        uses: actions/checkout@v4
      # 2. Installe Python 3.12 sur le runner
      #    avec le cache pip activé pour accélérer les prochaines exécutions
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      # 3. Installe les dépendances du projet
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      # 4. Lance les tests avec pytest
      #    Si un test échoue, le job s'arrête ici en erreur
      - name: Lancer les tests
        run: pytest -q
      # 5. Ajouter le linting
      - name: Vérifier le style avec flake8
        run: |
          pip install flake8
          flake8 app.py --max-line-length=88


  # ---------------------------------------------------------
  # JOB 2 : Build Docker
  # Ce job ne se lance QUE si le job "test" réussit.
  # ---------------------------------------------------------
  build:
    # "needs" crée une dépendance : build attend test
    needs: test
    runs-on: ubuntu-latest
    steps:
      # 1. Récupère le code (chaque job a son propre runner vierge)
      - name: Récupérer le code
        uses: actions/checkout@v4
      # 2. Construit l'image Docker
      #    Le tag utilise le SHA du commit pour identifier la version
      - name: Construire l'image Docker
        run: docker build -t myapp:${{ github.sha }} .
      # 3. Affiche un message de confirmation
      #    (dans un vrai projet, on pousserait l'image vers un registre)
      - name: Confirmer le build
        run: echo "Image construite avec le tag myapp:${GITHUB_SHA}"

